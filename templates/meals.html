{% extends 'base_app.html' %}{% block title %}Repas · NutriAI{% endblock %}{% block h1 %}Journal alimentaire{% endblock %}{% block content %}<section class="card"><div class="section-head"><div><div class="kicker">Historique réel</div><div class="title">Repas par journée</div></div><div class="date-nav"><button class="icon-action" onclick="moveDay(-1)"><i class="fa-solid fa-chevron-left"></i></button><input class="input" type="date" id="dayPick"><button class="icon-action" onclick="moveDay(1)"><i class="fa-solid fa-chevron-right"></i></button></div></div><div class="metric-grid"><div class="metric"><small>Calories</small><strong id="mkcal">—</strong></div><div class="metric"><small>Protéines</small><strong id="mprot">—</strong></div><div class="metric"><small>Repas</small><strong id="mcount">—</strong></div></div><div class="meal-list" id="mealJournal" style="margin-top:16px"></div></section>{% endblock %}{% block scripts %}<script>
const pick=document.getElementById('dayPick');pick.value=new Date().toISOString().slice(0,10);pick.onchange=loadDay;function moveDay(n){const d=new Date(pick.value+'T12:00:00');d.setDate(d.getDate()+n);pick.value=d.toISOString().slice(0,10);loadDay()}
async function loadDay(){try{const d=await Nutri.api('/meals/day?date='+pick.value);mkcal.textContent=Math.round(d.totals.calories)+' kcal';mprot.textContent=Math.round(d.totals.protein)+' g';mcount.textContent=d.meals.length;mealJournal.innerHTML=d.meals.length?d.meals.map(m=>`<div class="meal-row"><div class="meal-icon"><i class="fa-solid fa-utensils"></i></div><div><div class="meal-name">${m.description}</div><div class="meal-meta">${m.logged_at?new Date(m.logged_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''} · P ${Math.round(m.protein)}g · G ${Math.round(m.carbs)}g · L ${Math.round(m.fat)}g</div></div><div class="meal-kcal">${Math.round(m.calories)} kcal</div><button class="icon-action" onclick="editMeal(${m.id},${JSON.stringify(m.description).replaceAll('"','&quot;')},${m.calories},${m.protein},${m.carbs},${m.fat})"><i class="fa-solid fa-pen"></i></button></div>`).join(''):`<div class="empty"><i class="fa-regular fa-calendar-xmark"></i>Aucun repas pour cette date.</div>`}catch(e){Nutri.toast(e.message)}}
function editMeal(id,desc,k,p,c,f){Nutri.modal(`<div class="kicker">Modifier le repas</div><div class="title" style="margin-bottom:14px">Valeurs enregistrées</div><div class="field"><label>Description</label><input class="input" id="edesc" value="${desc}"></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Calories</label><input class="input" id="ek" type="number" value="${k}"></div><div class="field"><label>Protéines (g)</label><input class="input" id="ep" type="number" value="${p}"></div><div class="field"><label>Glucides (g)</label><input class="input" id="ec" type="number" value="${c}"></div><div class="field"><label>Lipides (g)</label><input class="input" id="ef" type="number" value="${f}"></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" onclick="saveMeal(${id})">Enregistrer</button><button class="btn btn-danger" onclick="delMeal(${id})">Supprimer</button><button class="btn btn-soft" onclick="Nutri.closeModal()">Annuler</button></div>`)}
async function saveMeal(id){try{await Nutri.api('/meals/meal/'+id,{method:'PUT',body:JSON.stringify({description:edesc.value,calories:ek.value,protein:ep.value,carbs:ec.value,fat:ef.value})});Nutri.closeModal();Nutri.toast('Repas modifié');loadDay()}catch(e){Nutri.toast(e.message)}}async function delMeal(id){try{await Nutri.api('/meals/meal/'+id,{method:'DELETE'});Nutri.closeModal();Nutri.toast('Repas supprimé');loadDay()}catch(e){Nutri.toast(e.message)}}document.addEventListener('DOMContentLoaded',loadDay);
</script>{% endblock %}
